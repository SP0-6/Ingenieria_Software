<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Mejor Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <img src="images/user-icon.png">
        
        <label for="username">Usuario</label>
        <input type="text" class="campo-texto" id="username" placeholder="Nombre" required>
        
        <label for="password">Contraseña</label>
        <input type="password" class="campo-texto" id="password" placeholder="Contraseña" required>

        <div class="box-visible">
            <input type="checkbox" id="visible">
            <label for="visible">Mostrar contraseña</label>
        </div>

        <button type="submit" id="submit">Iniciar sesión</button>
    </form>

    <script src="login.js"></script>
</body>
</html>
