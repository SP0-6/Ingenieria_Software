<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body>
    <div class="wrapper">
        <h1>Registrarse</h1>
        <p id="msj-error"></p>
        <form>
            
            <div class="input-box">
                <label for="firstname-input">
                    <span class="material-symbols-outlined">
                        person
                    </span>
                </label>
                <input type="text" class="campo-texto" id="firstname-input" name="firstname" placeholder="Nombre" required>
            </div>

            <div class="input-box">
                <label for="email-input">
                    <span class="material-symbols-outlined">
                        mail
                    </span>
                </label>
                <input type="email" class="campo-texto" id="email-input" name="email" placeholder="usuario@email.com" required>
            </div>

            <div class="input-box">
                <label for="password-input">
                    <span class="material-symbols-outlined">
                        lock
                    </span>
                </label>
                <input type="password" class="campo-texto" id="password-input" name="password" placeholder="Contraseña" required>
            </div>

            <div class="input-box">
                <label for="password-repeat-input">
                    <span class="material-symbols-outlined">
                        repeat
                    </span>
                </label>
                <input type="password" class="campo-texto" id="password-repeat-input" name="password-repeat" placeholder="Repetir contraseña" required>
            </div>

            <div class="box-visible">
                <input type="checkbox" id="visible">
                <label for="visible">Mostrar contraseña</label>
            </div>

            <button type="submit" id="submit">Registrarse</button>
        </form>
        <a href="login.html">Ya tengo una cuenta</a>
    </div>
    <script src="validation.js"></script>
</body>
</html>
