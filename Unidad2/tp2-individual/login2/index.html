<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>
    <div class="wrapper">
        <div class="container-form">
            <form class="sign-in">
                <h2>Iniciar Sesión</h2>
                <div class="social">
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-x"></ion-icon>
                    <ion-icon name="logo-twitch"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <span>Use su correo y contraseña</span>

                <div class="input-container">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" placeholder="usuario@mail.com" required>
                </div>

                <div class="input-container">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <a href="#">Olvidé mi contraseña</a>

                <button class="button" id="submit-inicio">Iniciar Sesión</button>
            </form>
        </div>

        <div class="container-form">
            <form class="sign-up">
                <h2>Registrarse</h2>
                <div class="social">
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-x"></ion-icon>
                    <ion-icon name="logo-twitch"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <span>Use su correo para registrarse</span>

                <div class="input-container">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" placeholder="Nombre de usuario" required>
                </div>

                <div class="input-container">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="email" placeholder="usuario@mail.com" required>
                </div>

                <div class="input-container">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <button class="button" id="submit-registro">Registrarse</button>
            </form>
        </div>

        <div class="welcome-container">
        <div class="welcome-sign-up welcome">
            <h2>Bienvenido</h2>
            <p>Ingrese sus datos para usar todas las funciones del sitio</p>
            <button class="button" id="btn-up">Registrarse</button>
        </div>

        <div class="welcome-sign-in welcome">
            <h2>Hola</h2>
            <p>Regístrese con sus datos para usar todas las funciones del sitio</p>
            <button class="button" id="btn-in">Iniciar Sesión</button>
        </div>
    </div>
    </div>

    

    <script src="script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
